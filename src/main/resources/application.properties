# application name
spring.application.name=f1_api
spring.main.web-application-type=servlet
# Server settings
server.port=8080
spring.web.resources.static-locations=classpath:/static/


# Database connection properties
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway Migration - ENABLED
spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.default-schema=f1_api
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- HikariCP Pool Settings ---
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=15000

# PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# OAUTH2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# JWT configuration
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=3600000

# --- Redis (Upstash) Configuration ---
spring.data.redis.url=${UPSTASH_REDIS_URL}

# Cache Type
spring.cache.type=redis
# Set cache TTL (e.g., 1 hour = 3600000ms)
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.jackson.serialization.fail-on-empty-beans=false
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'org.graalvm.buildtools.native' version '1.1.6'
}

group = 'be.michielve'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters (Updated for Spring Boot 4 modular structure)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // Database & Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'io.netty:netty-codec-http:4.2.13.Final'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-71:3.15.2'

    // Caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // AWS Lambda
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.22'
    implementation 'com.amazonaws:aws-lambda-java-events:3.15.0'
    implementation 'com.amazonaws.serverless:aws-serverless-java-container-springboot4:3.0.0'

    // AWS SDK
    implementation platform('software.amazon.awssdk:bom:2.30.13')
    implementation 'software.amazon.awssdk:secretsmanager'

    // Security & JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Utilities
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'org.json:json:20251224'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'io.github.cdimascio:dotenv-java:3.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.wiremock:wiremock-jetty12:3.13.2'
}

springBoot {
    mainClass = 'be.michielve.f1_api.F1ApiApplication'
}

bootJar {
    enabled = true
    archiveFileName = 'f1_api-boot.jar'
}

jar {
    enabled = true
    archiveFileName = 'f1_api.jar'
    manifest {
        attributes 'Implementation-Title': 'f1_api'
    }
}

tasks.register('copyDependencies', Copy) {
    dependsOn configurations.runtimeClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('libs/dependency')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn copyDependencies

tasks.named('test') {
    systemProperty "wiremock.record", System.getProperty("wiremock.record")
    useJUnitPlatform()
}

dependencyLocking {
    lockAllConfigurations()
}

graalvmNative {
    binaries {
        main {
            buildArgs.add('--initialize-at-build-time=ch.qos.logback,org.slf4j')
            buildArgs.add('--initialize-at-run-time=io.netty.handler.ssl.JdkSslServerContext,io.netty.handler.ssl.BouncyCastleAlpnSslUtils')
        }
    }
    metadataRepository {
        enabled = false
    }
}
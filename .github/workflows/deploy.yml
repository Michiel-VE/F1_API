name: Build and Deploy Native F1 API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: f1-api
          IMAGE_TAG: v${{ github.run_number }}
        run: |
          FULL_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          echo "==> Building Docker image without cache..."
          docker build --no-cache --platform linux/amd64 --provenance=false -t $FULL_URI .

          echo "==> Pushing image to ECR..."
          docker push $FULL_URI

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_URI=$FULL_URI" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_db_username: ${{ secrets.TF_VAR_db_username }}
          TF_VAR_db_url: ${{ secrets.TF_VAR_db_url }}
          TF_VAR_google_client: ${{ secrets.TF_VAR_google_client }}
          TF_VAR_google_client_secret: ${{ secrets.TF_VAR_google_client_secret }}
          TF_VAR_jwt_secret_key: ${{ secrets.TF_VAR_jwt_secret_key }}
          TF_VAR_aws_account_id: ${{ secrets.TF_VAR_aws_account_id }}
          TF_VAR_upstash_redis_token: ${{ secrets.TF_VAR_upstash_redis_token }}
          TF_VAR_upstash_redis_url: ${{ secrets.TF_VAR_upstash_redis_url }}
        run: terraform apply -auto-approve

      # All five Lambdas (the main API + the four scraper/updater
      # functions) share the same container image. Terraform apply
      # above should already update every one of them since they all
      # reference the same var.image_uri, but this step force-updates
      # each explicitly as a belt-and-suspenders guarantee -- so a
      # partial/failed Terraform update to any single function doesn't
      # silently leave it on the old image.
      - name: Force Update All AWS Lambda Images
        env:
          AWS_REGION: eu-north-1
        run: |
          FUNCTIONS=(
            "f1-api-lambda"
            "f1-api-race-updater"
            "f1-api-driver-team-updater"
            "f1-api-standing-updater"
            "f1-api-race-result-updater"
          )

          for FN in "${FUNCTIONS[@]}"; do
            echo "==> Waiting for any ongoing updates on $FN..."
            aws lambda wait function-updated --function-name "$FN"

            echo "==> Force updating $FN to ${{ env.FULL_URI }}..."
            aws lambda update-function-code \
              --function-name "$FN" \
              --image-uri "${{ env.FULL_URI }}"

            echo "==> Waiting for $FN update to finish..."
            aws lambda wait function-updated --function-name "$FN"
          done

      # The main API Lambda is invoked via the "prod" alias, not
      # $LATEST. update-function-code above only touches $LATEST, so
      # without this, API Gateway keeps calling the old published
      # version forever -- publish a new version and move the alias.
      - name: Publish New Version and Update Alias
        env:
          AWS_REGION: eu-north-1
        run: |
          NEW_VERSION=$(aws lambda publish-version \
            --function-name f1-api-lambda \
            --query 'Version' --output text)

          echo "==> Published version $NEW_VERSION"

          aws lambda update-alias \
            --function-name f1-api-lambda \
            --name prod \
            --function-version "$NEW_VERSION"

          echo "==> prod alias now points to version $NEW_VERSION"
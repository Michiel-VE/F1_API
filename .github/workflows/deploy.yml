name: Build and Deploy Native F1 API

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GraalVM Java 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'oracle'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Native Executable
        run: ./gradlew nativeCompile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: f1-api
          IMAGE_TAG: v${{ github.run_number }}
        run: |
          FULL_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          
          echo "==> Building Docker image..."
          docker build --platform linux/amd64 --provenance=false -t $FULL_URI .
          
          echo "==> Pushing image to ECR..."
          docker push $FULL_URI
          
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_URI=$FULL_URI" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        env:
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
        run: |
          cd infra
          terraform init
          terraform apply -auto-approve